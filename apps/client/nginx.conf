server {
  listen 80;
  sendfile on;
  default_type application/octet-stream;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  root /usr/share/nginx/html;
  absolute_redirect off;

  resolver 127.0.0.11 valid=10s;

  location /api/v1/suggestion {
    set $genai_upstream genai-service:8080;
    proxy_pass http://$genai_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location /api/v1/route {
    set $route_upstream route-service:8080;
    proxy_pass http://$route_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/v1/logbook {
    set $logbook_upstream logbook-service:8080;
    proxy_pass http://$logbook_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }
}
