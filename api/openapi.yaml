openapi: 3.1.0
info:
  title: Cancelled API
  version: 1.0.0
servers:
- {url: 'https://cancelled.stud.k8s.aet.cit.tum.de/api', description: Server url}
paths:
  /v1/route/stations:
    get:
      tags:
        - route
      operationId: getStations
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Station'}
  /v1/route:
    get:
      tags:
        - route
      operationId: getConnections
      parameters:
      - name: time
        in: query
        required: true
        schema: {type: string, format: date-time}
      - name: startStationId
        in: query
        required: true
        schema: {type: string}
      - name: destinationStationId
        in: query
        required: true
        schema: {type: string}
      - name: viaStationIds
        in: query
        required: false
        schema:
          type: array
          items: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TrainConnection'}

  /v1/logbook/entries:
    get:
      tags: [logbook]
      operationId: getLogbookEntries
      parameters:
      - name: from
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: to
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: q
        in: query
        required: false
        schema: {type: string}
      - name: transportMode
        in: query
        required: false
        schema: {$ref: '#/components/schemas/TransportMode'}
      - name: startCity
        in: query
        required: false
        schema: {type: string}
      - name: endCity
        in: query
        required: false
        schema: {type: string}
      - name: page
        in: query
        required: false
        schema: {type: integer, minimum: 0, default: 0}
      - name: size
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogbookEntryPage'}
    post:
      tags: [logbook]
      operationId: createLogbookEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLogbookEntryRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogbookEntry'}
        '400':
          description: Bad Request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /v1/logbook/entries/{entryId}:
    get:
      tags: [logbook]
      operationId: getLogbookEntryById
      parameters:
      - name: entryId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogbookEntry'}
        '404':
          description: Not Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      tags: [logbook]
      operationId: updateLogbookEntry
      parameters:
      - name: entryId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateLogbookEntryRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogbookEntry'}
        '400':
          description: Bad Request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      tags: [logbook]
      operationId: deleteLogbookEntry
      parameters:
      - name: entryId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

# GenAI suggestion endpoint is a WebSocket — see asyncapi.yaml

components:
  schemas:
    Station:
      tags:
        - route
      type: object
      required:
        - id
      properties:
        id: {type: string}
        name: {type: string}
    TrainConnection:
      tags:
        - route
      type: object
      required:
        - segments
        - arrivalTime
        - departureTime
      properties:
        departureTime: {type: string, format: date-time}
        arrivalTime: {type: string, format: date-time}
        segments:
          type: array
          items: {$ref: '#/components/schemas/TrainSegment'}
    TrainSegment:
      tags:
        - route
      type: object
      required:
        - arrivalTime
        - departureTime
        - start
        - end
      properties:
        departureTime: {type: string, format: date-time}
        arrivalTime: {type: string, format: date-time}
        start: {$ref: '#/components/schemas/Station'}
        end: {$ref: '#/components/schemas/Station'}
        stops:
          type: array
          items: {$ref: '#/components/schemas/Station'}

    TransportMode:
      type: string
      enum:
        - TRAIN
        - BUS
        - TRAM
        - SUBWAY
        - FERRY
        - FLIGHT
        - CAR
        - BIKE
        - WALK
        - OTHER

    LocationRef:
      type: object
      required:
        - city
      properties:
        city: {type: string}
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code.
          example: DE
        stationId:
          type: string
          description: Station id from route service when available.
        stationName:
          type: string
          description: Human-readable station name.
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}

    JourneyLeg:
      type: object
      required:
        - mode
        - start
        - end
        - departureTime
        - arrivalTime
      properties:
        mode: {$ref: '#/components/schemas/TransportMode'}
        start: {$ref: '#/components/schemas/LocationRef'}
        end: {$ref: '#/components/schemas/LocationRef'}
        departureTime: {type: string, format: date-time}
        arrivalTime: {type: string, format: date-time}
        provider: {type: string, description: Carrier or provider name.}
        line:
          type: string
          description: Optional line, flight number, or route code.
        notes: {type: string}

    RouteReference:
      type: object
      description: Reference to a connection selected from route-service results.
      properties:
        startStationId: {type: string}
        destinationStationId: {type: string}
        viaStationIds:
          type: array
          items: {type: string}
        requestedTime: {type: string, format: date-time}
        selectedConnection: {$ref: '#/components/schemas/TrainConnection'}

    LogbookEntry:
      type: object
      required:
        - id
        - title
        - startTime
        - endTime
        - start
        - destination
        - primaryTransportMode
        - createdAt
        - updatedAt
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        start: {$ref: '#/components/schemas/LocationRef'}
        destination: {$ref: '#/components/schemas/LocationRef'}
        primaryTransportMode: {$ref: '#/components/schemas/TransportMode'}
        legs:
          type: array
          items: {$ref: '#/components/schemas/JourneyLeg'}
          description: Optional detailed itinerary across one or more legs.
        routeReference:
          $ref: '#/components/schemas/RouteReference'
        distanceKm:
          type: number
          format: double
          minimum: 0
        costAmount:
          type: number
          format: double
          minimum: 0
        costCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code.
          example: EUR
        delayMinutes:
          type: integer
          minimum: 0
        tags:
          type: array
          items: {type: string, maxLength: 40}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    CreateLogbookEntryRequest:
      type: object
      required:
        - title
        - startTime
        - endTime
        - start
        - destination
        - primaryTransportMode
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000}
        startTime: {type: string, format: date-time}
        endTime: {type: string, format: date-time}
        start: {$ref: '#/components/schemas/LocationRef'}
        destination: {$ref: '#/components/schemas/LocationRef'}
        primaryTransportMode: {$ref: '#/components/schemas/TransportMode'}
        legs:
          type: array
          items: {$ref: '#/components/schemas/JourneyLeg'}
        routeReference:
          $ref: '#/components/schemas/RouteReference'
        distanceKm:
          type: number
          format: double
          minimum: 0
        costAmount:
          type: number
          format: double
          minimum: 0
        costCurrency:
          type: string
          minLength: 3
          maxLength: 3
        delayMinutes:
          type: integer
          minimum: 0
        tags:
          type: array
          items: {type: string, maxLength: 40}

    UpdateLogbookEntryRequest:
      allOf:
        - $ref: '#/components/schemas/CreateLogbookEntryRequest'

    LogbookEntryPage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LogbookEntry'}
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
        code: {type: string}
        details:
          type: array
          items: {type: string}

    # WebSocket message schemas — see asyncapi.yaml for the channel definition
    TextUpdate:
      type: object
      required: [type, textBefore]
      properties:
        type:
          type: string
          const: text_update
        textBefore:
          type: string
          description: Report text before the cursor.
          example: "Today I arrived in Marburg and walked through the old town."
        textAfter:
          type: string
          description: Report text after the cursor, if any.
          example: "The weather was perfect."

    CancelSuggestion:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: cancel

    SuggestionToken:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          const: token
        token:
          type: string
          description: A single text token to append to the inline suggestion.
          example: " The castle"

    SuggestionDone:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: done
