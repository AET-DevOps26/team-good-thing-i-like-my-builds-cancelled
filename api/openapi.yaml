# GenAI suggestion endpoint is a WebSocket — see asyncapi.yaml

components:
  schemas:
    Station:
      tags:
        - route
      type: object
      required:
        - id
      properties:
        id: {type: string}
        name: {type: string}
    TrainConnection:
      tags:
        - route
      type: object
      required:
        - segments
        - arrivalTime
        - departureTime
      properties:
        departureTime: {type: string, format: date-time}
        arrivalTime: {type: string, format: date-time}
        segments:
          type: array
          items: {$ref: '#/components/schemas/TrainSegment'}
    TrainSegment:
      tags:
        - route
      type: object
      required:
        - arrivalTime
        - departureTime
        - start
        - end
      properties:
        departureTime: {type: string, format: date-time}
        arrivalTime: {type: string, format: date-time}
        start: {$ref: '#/components/schemas/Station'}
        end: {$ref: '#/components/schemas/Station'}
        stops:
          type: array
          items: {$ref: '#/components/schemas/Station'}

    # WebSocket message schemas — see asyncapi.yaml for the channel definition
    TextUpdate:
      type: object
      required: [type, textBefore]
      properties:
        type:
          type: string
          const: text_update
        textBefore:
          type: string
          description: Report text before the cursor.
          example: "Today I arrived in Marburg and walked through the old town."
        textAfter:
          type: string
          description: Report text after the cursor, if any.
          example: "The weather was perfect."

    CancelSuggestion:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: cancel

    SuggestionToken:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          const: token
        token:
          type: string
          description: A single text token to append to the inline suggestion.
          example: " The castle"

    SuggestionDone:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: done
