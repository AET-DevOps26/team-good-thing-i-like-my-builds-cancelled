openapi: 3.1.0
info:
  title: Cancelled API
  version: 1.0.0
servers:
- {url: 'https://cancelled.stud.k8s.aet.cit.tum.de/api', description: Server url}
paths:
  /v1/route/stations:
    get:
      tags:
        - route
      operationId: getStations
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Station'}
  /v1/route:
    get:
      tags:
        - route
      operationId: getConnections
      parameters:
      - name: time
        in: query
        required: true
        schema: {type: string, format: date-time}
      - name: startStationId
        in: query
        required: true
        schema: {type: string}
      - name: destinationStationId
        in: query
        required: true
        schema: {type: string}
      - name: viaStationIds
        in: query
        required: false
        schema:
          type: array
          items: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TrainConnection'}

  /v1/logbook/entries:
    get:
      tags: [logbook]
      operationId: getLogbookEntries
      responses:
        '200':
          description: OK
          # Add model here
    # post:
      # tags: [logbook]
      # operationId: addLogbookEntry
      # requestBody:
        # content:
          # application/json:
            # Add model
        # required: true
      # responses:
        # '201':
          # description: Created
          # Add model
# TODO: Finish Logbook API

  /v1/ai/suggest-continuation:
    post:
      tags: [ai]
      operationId: suggestReportContinuation
      summary: Suggest how to continue a travel report at the current cursor position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestContinuationRequest'
      responses:
        '200':
          description: A single continuation suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestContinuationResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

components:
  schemas:
    Station:
      tags:
        - route
      type: object
      required:
        - id
      properties:
        id: {type: string}
        name: {type: string}
    TrainConnection:
      tags:
        - route
      type: object
      required:
        - segments
        - arrivalTime
        - departureTime
      properties:
        departureTime: {type: string, format: date-time}
        arrivalTime: {type: string, format: date-time}
        segments:
          type: array
          items: {$ref: '#/components/schemas/TrainSegment'}
    TrainSegment:
      tags:
        - route
      type: object
      required:
        - arrivalTime
        - departureTime
        - start
        - end
      properties:
        departureTime: {type: string, format: date-time}
        arrivalTime: {type: string, format: date-time}
        start: {$ref: '#/components/schemas/Station'}
        end: {$ref: '#/components/schemas/Station'}
        stops:
          type: array
          items: {$ref: '#/components/schemas/Station'}

    SuggestContinuationRequest:
      type: object
      required:
        - textBefore
      properties:
        textBefore:
          type: string
          minLength: 1
          description: Report text before the cursor position.
          example: "Today I arrived in Marburg and walked through the old town."
        textAfter:
          type: string
          description: Report text after the cursor position, if any.
          example: "The weather was perfect."

    SuggestContinuationResponse:
      type: object
      required:
        - suggestion
      properties:
        suggestion:
          type: string
          description: Suggested text to insert at the cursor position.
          example: " The castle on the hill was breathtaking."
