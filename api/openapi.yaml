openapi: 3.1.0
info:
  title: Cancelled API
  version: 1.0.0
servers:
- {url: 'https://cancelled.stud.k8s.aet.cit.tum.de/api', description: Server url}
paths:
  /v1/route/stations:
    get:
      tags:
        - route
      operationId: getStations
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Station'}
  /v1/route:
    get:
      tags:
        - route
      operationId: getConnections
      parameters:
      - name: time
        in: query
        required: true
        schema: {type: string, format: date-time}
      - name: startStationId
        in: query
        required: true
        schema: {type: string}
      - name: destinationStationId
        in: query
        required: true
        schema: {type: string}
      - name: viaStationIds
        in: query
        required: false
        schema:
          type: array
          items: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TrainConnection'}

  /v1/logbook/entries:
    get:
      tags: [logbook]
      operationId: getLogbookEntries
      responses:
        '200':
          description: OK
