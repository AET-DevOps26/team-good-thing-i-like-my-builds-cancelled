name: Build Server

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/server/logbook-service/**'
      - 'apps/server/route-service/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/server/logbook-service/**'
      - 'apps/server/route-service/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            logbook_service:
              - 'apps/server/logbook-service/**'
            route_service:
              - 'apps/server/route-service/**'

      - name: Build service matrix
        id: matrix
        shell: bash
        run: |
          matrix='[]'
          has_changes=false

          if [ "${{ steps.filter.outputs.logbook_service }}" = "true" ]; then
            matrix=$(jq -c '. + [{"name":"logbook-service","context":"./apps/server/logbook-service","dockerfile":"./apps/server/logbook-service/Dockerfile","image":"logbook-service"}]' <<< "$matrix")
            has_changes=true
          fi

          if [ "${{ steps.filter.outputs.route_service }}" = "true" ]; then
            matrix=$(jq -c '. + [{"name":"route-service","context":"./apps/server/route-service","dockerfile":"./apps/server/route-service/Dockerfile","image":"route-service"}]' <<< "$matrix")
            has_changes=true
          fi

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
