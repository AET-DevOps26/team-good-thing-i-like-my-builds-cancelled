name: Build Server

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/server/logbook-service/**'
      - 'apps/server/route-service/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/server/logbook-service/**'
      - 'apps/server/route-service/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to build, or "all"'
        required: false
        default: all
        type: choice
        options:
          - all
          - logbook-service
          - route-service

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            logbook_service:
              - 'apps/server/logbook-service/**'
            route_service:
              - 'apps/server/route-service/**'

      - name: Build service matrix
        id: matrix
        shell: bash
        env:
          MANUAL_SERVICES: ${{ github.event_name == 'workflow_dispatch' && inputs.services || '' }}
        run: |
          matrix='[]'
          has_changes=false

          add_service() {
            local service_name="$1"
            local service_context="$2"
            local service_dockerfile="$3"
            local service_image="$4"
            matrix=$(jq -c --arg name "$service_name" --arg context "$service_context" --arg dockerfile "$service_dockerfile" --arg image "$service_image" '. + [{"name":$name,"context":$context,"dockerfile":$dockerfile,"image":$image}]' <<< "$matrix")
            has_changes=true
          }

          if [ -n "$MANUAL_SERVICES" ]; then
            if [ "$MANUAL_SERVICES" = "all" ]; then
              add_service "logbook-service" "./apps/server/logbook-service" "./apps/server/logbook-service/Dockerfile" "logbook-service"
              add_service "route-service" "./apps/server/route-service" "./apps/server/route-service/Dockerfile" "route-service"
            else
              IFS=',' read -ra requested_services <<< "$MANUAL_SERVICES"
              for requested_service in "${requested_services[@]}"; do
                requested_service="$(echo "$requested_service" | xargs)"
                case "$requested_service" in
                  logbook_service|logbook-service)
                    add_service "logbook-service" "./apps/server/logbook-service" "./apps/server/logbook-service/Dockerfile" "logbook-service"
                    ;;
                  route_service|route-service)
                    add_service "route-service" "./apps/server/route-service" "./apps/server/route-service/Dockerfile" "route-service"
                    ;;
                esac
              done
            fi
          else
            if [ "${{ steps.filter.outputs.logbook_service }}" = "true" ]; then
              add_service "logbook-service" "./apps/server/logbook-service" "./apps/server/logbook-service/Dockerfile" "logbook-service"
            fi

            if [ "${{ steps.filter.outputs.route_service }}" = "true" ]; then
              add_service "route-service" "./apps/server/route-service" "./apps/server/route-service/Dockerfile" "route-service"
            fi
          fi

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
