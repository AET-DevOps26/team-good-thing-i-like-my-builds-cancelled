name: Ansible Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ANSIBLE_HOST_KEY_CHECKING: "false"

      TF_STATE_RG: ${{ vars.TF_STATE_RG || 'GTILMBC' }}
      TF_STATE_LOCATION: ${{ vars.TF_STATE_LOCATION || 'swedencentral' }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT || 'traveljournalterraform' }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || 'travel-journal' }}

      VM_ADMIN_USER: ${{ vars.VM_ADMIN_USER || 'azureuser' }}

      GHCR_REGISTRY: ${{ vars.GHCR_REGISTRY || 'ghcr.io' }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      CLIENT_IMAGE: ${{ vars.CLIENT_IMAGE || 'ghcr.io/ORG/REPO/client:latest' }}
      LOGBOOK_IMAGE: ${{ vars.LOGBOOK_IMAGE || 'ghcr.io/ORG/REPO/logbook-service:latest' }}
      ROUTE_IMAGE: ${{ vars.ROUTE_IMAGE || 'ghcr.io/ORG/REPO/route-service:latest' }}
      DB_IMAGE: ${{ vars.DB_IMAGE || 'postgres:14.23' }}
      PGADMIN_IMAGE: ${{ vars.PGADMIN_IMAGE || 'dpage/pgadmin4:9.15' }}

      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'logbook_service' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'logbook_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGADMIN_EMAIL: ${{ vars.PGADMIN_EMAIL || 'admin@local.dev' }}
      PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: >
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}

      - name: Ensure Terraform state access
        shell: bash
        run: |
          set -euo pipefail

          az group create --name "$TF_STATE_RG" --location "$TF_STATE_LOCATION" --output none

          if ! az storage account show --name "$TF_STATE_STORAGE_ACCOUNT" --resource-group "$TF_STATE_RG" --output none 2>/dev/null; then
            az storage account create \
              --name "$TF_STATE_STORAGE_ACCOUNT" \
              --resource-group "$TF_STATE_RG" \
              --location "$TF_STATE_LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --allow-blob-public-access false \
              --output none
          fi

          account_key=$(az storage account keys list \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RG" \
            --query '[0].value' \
            --output tsv)
          echo "ARM_ACCESS_KEY=$account_key" >> "$GITHUB_ENV"

          az storage container create \
            --name "$TF_STATE_CONTAINER" \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --account-key "$account_key" \
            --output none

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=$TF_STATE_RG" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=vm.tfstate"

      - name: Read VM public IP
        working-directory: infra/terraform
        run: |
          echo "PUBLIC_IP=$(terraform output -raw public_ip_address)" >> "$GITHUB_ENV"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible

      - name: Run Ansible Playbook
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/ssh_key"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$key_path"
          chmod 600 "$key_path"
          ansible-playbook infra/ansible/playbooks/deploy.yml \
            -i "${PUBLIC_IP}," \
            -u "$VM_ADMIN_USER" \
            --private-key "$key_path"
