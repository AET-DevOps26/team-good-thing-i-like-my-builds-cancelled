name: Run GenAI Tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/server/genai-service/**'

permissions:
  contents: read

env:
  SERVICE_PATH: apps/server/genai-service

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/server/genai-service

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
