name: Deploy to K8s

on:
  workflow_run:
    workflows: ["Build Server", "Build Client", "Build GenAI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
      
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up kubeconfig
        working-directory: infra/kubernetes
        run: |
          mkdir -p ~/.kube
          envsubst < cancelled.yaml > ~/.kube/config
          
      - name: Create/update k8s secret
        run: |
          kubectl create secret generic llm-secret \
            --from-literal=LMSTUDIO_API_KEY="${{ secrets.LMSTUDIO_API_KEY }}" \
            -n cancelled \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update grafana admin secret
        run: |
          kubectl create secret generic grafana-admin-secret \
            --from-literal=GF_SECURITY_ADMIN_USER="${{ secrets.GF_SECURITY_ADMIN_USER }}" \
            --from-literal=GF_SECURITY_ADMIN_PASSWORD="${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}" \
            -n cancelled-monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to k8s
        working-directory: infra/kubernetes/helm
        run: |
          helm -n cancelled upgrade --install cancelled .

      - name: Restart containers
        run: |
          deployments=$(kubectl get deployments -n cancelled -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
          for deploy in $deployments; do
            kubectl rollout restart deployment "$deploy" -n cancelled
          done

