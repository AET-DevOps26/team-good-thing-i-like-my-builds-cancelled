name: Terraform Azure VM

on:
  workflow_dispatch:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
      TF_BACKEND_KEY: ${{ secrets.TF_BACKEND_KEY }}
      TF_BACKEND_ACCESS_KEY: ${{ secrets.TF_BACKEND_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 'latest'

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

#      - name: Generate ephemeral SSH key
#        run: |
#          set -e
#          mkdir -p /tmp/ci_ssh
#          ssh-keygen -t rsa -b 4096 -f /tmp/ci_ssh/id_rsa -N "" -C "ci-${{ github.run_id }}"
#          chmod 600 /tmp/ci_ssh/id_rsa
#          echo "TF_VAR_admin_ssh_public_key_path=/tmp/ci_ssh/id_rsa.pub" >> $GITHUB_ENV
#          echo "SSH_PRIVATE_KEY_PATH=/tmp/ci_ssh/id_rsa" >> $GITHUB_ENV

      - name: Setup SSH key from secret
        run: |
          mkdir -p /tmp/ci_ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ci_ssh/id_rsa.pub
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ci_ssh/id_rsa
          chmod 600 /tmp/ci_ssh/id_rsa
          echo "TF_VAR_admin_ssh_public_key_path=/tmp/ci_ssh/id_rsa.pub" >> $GITHUB_ENV

      - name: Add private key to ssh-agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-add /tmp/ci_ssh/id_rsa || true

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}"

      - name: Terraform Format
        working-directory: infra/terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan -input=false

      - name: Upload plan artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/terraform/tfplan

      - name: Terraform Destroy and Replan #(only on main)
#        if: github.ref == 'refs/heads/main'
        working-directory: infra/terraform
        run: |
          set -e
          terraform destroy -auto-approve -input=false || true
          terraform plan -out=tfplan -input=false

      - name: Terraform Apply (only on main)
#        if: github.ref == 'refs/heads/main'
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve tfplan
