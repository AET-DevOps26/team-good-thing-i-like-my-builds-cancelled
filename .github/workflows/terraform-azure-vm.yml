name: Terraform Azure VM

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 'latest'

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate ephemeral SSH key
        run: |
          set -e
          mkdir -p /tmp/ci_ssh
          ssh-keygen -t ed25519 -f /tmp/ci_ssh/id_ed25519 -N "" -C "ci-${{ github.run_id }}"
          chmod 600 /tmp/ci_ssh/id_ed25519
          echo "TF_VAR_admin_ssh_public_key_path=/tmp/ci_ssh/id_ed25519.pub" >> $GITHUB_ENV
          echo "SSH_PRIVATE_KEY_PATH=/tmp/ci_ssh/id_ed25519" >> $GITHUB_ENV

      - name: Add private key to ssh-agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-add /tmp/ci_ssh/id_ed25519 || true

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform Format
        working-directory: infra/terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan -input=false

      - name: Upload plan artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/terraform/tfplan

      - name: Terraform Apply (only on main)
#        if: github.ref == 'refs/heads/main'
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve tfplan
