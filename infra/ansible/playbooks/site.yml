---
- name: Configure VM and deploy containers
  hosts: all
  become: true
  vars:
    vm_admin_user: "{{ lookup('env', 'VM_ADMIN_USER') | default('azureuser', true) }}"
    app_dir: "{{ lookup('env', 'APP_DIR') | default('/opt/gtilmbc', true) }}"
    compose_project_name: "{{ lookup('env', 'COMPOSE_PROJECT_NAME') | default('gtilmbc', true) }}"
    timezone: "{{ lookup('env', 'TIMEZONE') | default('Europe/Berlin', true) }}"

    client_image: "{{ lookup('env', 'CLIENT_IMAGE') | default('ghcr.io/ORG/REPO/client:latest', true) }}"
    logbook_image: "{{ lookup('env', 'LOGBOOK_IMAGE') | default('ghcr.io/ORG/REPO/logbook-service:latest', true) }}"
    route_image: "{{ lookup('env', 'ROUTE_IMAGE') | default('ghcr.io/ORG/REPO/route-service:latest', true) }}"
    db_image: "{{ lookup('env', 'DB_IMAGE') | default('postgres:14.23', true) }}"
    pgadmin_image: "{{ lookup('env', 'PGADMIN_IMAGE') | default('dpage/pgadmin4:9.15', true) }}"

    client_port: "{{ lookup('env', 'CLIENT_PORT') | default('4567', true) }}"
    db_port: "{{ lookup('env', 'DB_PORT') | default('55002', true) }}"
    pgadmin_port: "{{ lookup('env', 'PGADMIN_PORT') | default('5050', true) }}"
    logbook_port: "{{ lookup('env', 'LOGBOOK_PORT') | default('9100', true) }}"
    route_port: "{{ lookup('env', 'ROUTE_PORT') | default('9200', true) }}"

    postgres_db: "{{ lookup('env', 'POSTGRES_DB') | default('logbook_service', true) }}"
    postgres_user: "{{ lookup('env', 'POSTGRES_USER') | default('logbook_user', true) }}"
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') | default('CHANGE_ME', true) }}"
    pgadmin_email: "{{ lookup('env', 'PGADMIN_EMAIL') | default('admin@local.dev', true) }}"
    pgadmin_password: "{{ lookup('env', 'PGADMIN_PASSWORD') | default('CHANGE_ME', true) }}"

    ghcr_registry: "{{ lookup('env', 'GHCR_REGISTRY') | default('ghcr.io', true) }}"
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') | default('', true) }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [setup]

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
      tags: [setup]

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      tags: [setup]

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      tags: [setup]

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      tags: [setup]

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      tags: [setup]

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ vm_admin_user }}"
        groups: docker
        append: true
      tags: [setup]

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ vm_admin_user }}"
        group: "{{ vm_admin_user }}"
        mode: "0755"
      tags: [deploy]

    - name: Write docker-compose.yml
      ansible.builtin.template:
        src: ../templates/docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ vm_admin_user }}"
        group: "{{ vm_admin_user }}"
        mode: "0644"
      tags: [deploy]

    - name: Ensure GHCR credentials are set
      ansible.builtin.assert:
        that:
          - ghcr_username | length > 0
          - ghcr_token | length > 0
        fail_msg: "Set GHCR_USERNAME and GHCR_TOKEN for ghcr.io authentication."
      tags: [deploy]

    - name: Login to GHCR
      ansible.builtin.command: "docker login {{ ghcr_registry }} -u {{ ghcr_username }} -p {{ ghcr_token }}"
      no_log: true
      tags: [deploy]

    - name: Pull images
      ansible.builtin.command: "docker compose -f {{ app_dir }}/docker-compose.yml pull"
      args:
        chdir: "{{ app_dir }}"
      tags: [deploy]

    - name: Start services
      ansible.builtin.command: "docker compose -f {{ app_dir }}/docker-compose.yml up -d"
      args:
        chdir: "{{ app_dir }}"
      tags: [deploy]
