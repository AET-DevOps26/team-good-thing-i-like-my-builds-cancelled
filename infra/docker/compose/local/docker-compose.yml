name: gtilmbc
services:
    client:
        build: ../../../../apps/client
        hostname: client
        environment:
            TZ: "Europe/Berlin"
        ports:
            -   "4567:80"

    db:
        image: postgres:14.23
        hostname: db
        environment:
            TZ: "Europe/Berlin"
            POSTGRES_DB: logbook_service
            POSTGRES_USER: logbook_user
            POSTGRES_PASSWORD: logbook_password
        ports:
            -   "55002:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U logbook_user -d logbook_service"]
            interval: 10s
            timeout: 5s
            retries: 5

    pg_admin:
        image: dpage/pgadmin4:9.15
        hostname: pg_admin
        environment:
            TZ: "Europe/Berlin"
            PGADMIN_DEFAULT_EMAIL: admin@local.dev
            PGADMIN_DEFAULT_PASSWORD: admin123
        ports:
            -   "5050:80"
        depends_on:
            db:
                condition: service_healthy

    logbook-service:
        build: ../../../../apps/server/logbook-service
        hostname: logbook-service
        environment:
            TZ: "Europe/Berlin"
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logbook_service
            SPRING_DATASOURCE_USERNAME: logbook_user
            SPRING_DATASOURCE_PASSWORD: logbook_password
        ports:
            -   "9100:8080"
        depends_on:
            db:
                condition: service_healthy

    genai-service:
        build: ../../../../apps/server/genai-service
        hostname: genai-service
        environment:
            TZ: "Europe/Berlin"
            APP_PORT: "8080"
            LMSTUDIO_BASE_URL: "https://logos.aet.cit.tum.de"
            LMSTUDIO_MODEL: "openai/gpt-oss-120b"
            LMSTUDIO_API_KEY: "${LMSTUDIO_API_KEY}"
            # Embedding model for logbook RAG; leave empty to use keyword matching.
            LMSTUDIO_EMBEDDING_MODEL: "${LMSTUDIO_EMBEDDING_MODEL:-}"
            LOGBOOK_BASE_URL: "http://logbook-service:8080/api"
        ports:
            - "9300:8080"

    route-service:
        build: ../../../../apps/server/route-service
        hostname: route-service
        environment:
            TZ: "Europe/Berlin"
        ports:
            - "9200:8080"

    docs-portal:
        build: ../../../../apps/docs
        hostname: docs-portal
        ports:
            - "4570:80"
        volumes:
            - ../../../../api:/usr/share/nginx/html/specs:ro
        depends_on:
            - logbook-service
            - route-service
            - genai-service

    prometheus:
        image: prom/prometheus:v2.54.1
        hostname: prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
        ports:
            - "9090:9090"
        volumes:
            - ../../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ../../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
            - prometheus_data:/prometheus
        depends_on:
            - logbook-service
            - route-service
            - genai-service

    grafana:
        image: grafana/grafana:11.2.2
        hostname: grafana
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: "false"
        ports:
            - "3000:3000"
        volumes:
            - ../../../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ../../../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ../../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus

volumes:
    prometheus_data:
    grafana_data:
