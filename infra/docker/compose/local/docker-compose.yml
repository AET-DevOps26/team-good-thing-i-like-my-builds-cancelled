name: gtilmbc
services:
    client:
        build: ../../../../apps/client
        hostname: client
        environment:
            TZ: "Europe/Berlin"
        ports:
            -   "4567:80"

    db:
        image: postgres:14.23
        hostname: db
        environment:
            TZ: "Europe/Berlin"
            POSTGRES_DB: logbook_service
            POSTGRES_USER: logbook_user
            POSTGRES_PASSWORD: logbook_password
        ports:
            -   "55002:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U logbook_user -d logbook_service"]
            interval: 10s
            timeout: 5s
            retries: 5

    pg_admin:
        image: dpage/pgadmin4:9.15
        hostname: pg_admin
        environment:
            TZ: "Europe/Berlin"
            PGADMIN_DEFAULT_EMAIL: admin@local.dev
            PGADMIN_DEFAULT_PASSWORD: admin123
        ports:
            -   "5050:80"
        depends_on:
            db:
                condition: service_healthy

    logbook_service:
        build: ../../../../apps/server/logbook-service
        hostname: logbook_service
        environment:
            TZ: "Europe/Berlin"
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logbook_service
            SPRING_DATASOURCE_USERNAME: logbook_user
            SPRING_DATASOURCE_PASSWORD: logbook_password
        ports:
            -   "9100:8080"
        depends_on:
            db:
                condition: service_healthy

    genai_service:
        build: ../../../../apps/server/genai-service
        hostname: genai_service
        environment:
            TZ: "Europe/Berlin"
            APP_PORT: "8080"
            # LMStudio runs on the host machine — host.docker.internal resolves to it
            LMSTUDIO_BASE_URL: "http://host.docker.internal:1234"
            LMSTUDIO_MODEL: "google/gemma-4-e4b"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "9300:8080"

    route_service:
        build: ../../../../apps/server/route-service
        hostname: route_service
        environment:
            TZ: "Europe/Berlin"
        ports:
            - "9200:8080"

