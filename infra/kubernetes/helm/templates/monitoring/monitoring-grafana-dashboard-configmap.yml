{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    app: grafana
data:
  backend-observability.json: |
{{ .Files.Get "files/grafana/backend-observability.json" | indent 4 }}
{{- end }}
