---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logbook
  labels:
    app: logbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logbook
  template:
    metadata:
      labels:
        app: logbook
    spec:
      containers:
        - name: logbook
          image: # TODO
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: logbook-api
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
