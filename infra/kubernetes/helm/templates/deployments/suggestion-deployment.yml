---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suggestion
  labels:
    app: suggestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suggestion
  template:
    metadata:
      labels:
        app: suggestion
    spec:
      containers:
        - name: suggestion
          image: {{ .Values.image.registry }}/{{ .Values.image.owner }}/suggestion:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: suggestion-api
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
