image:
  registry: ghcr.io
  owner: aet-devops26/team-good-thing-i-like-my-builds-cancelled

images:
  genai: genai-service:main
  route: route-service:main
  logbook: logbook-service:main
  client: client:main

ingress:
  enabled: true
  host: cancelled.stud.k8s.aet.cit.tum.de

database:
  user: logbook_user

monitoring:
  enabled: true
  namespace: cancelled-monitoring
  createNamespace: true

  prometheus:
    image: prom/prometheus:v2.54.1
    scrapeInterval: 15s
    evaluationInterval: 15s
    storageSize: 5Gi

  grafana:
    image: grafana/grafana:11.2.2
    storageSize: 2Gi
    existingSecret: grafana-admin-secret
