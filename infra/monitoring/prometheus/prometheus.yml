global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: logbook-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets:
          - logbook-service:8080

  - job_name: route-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets:
          - route-service:8080

  - job_name: genai-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - genai-service:8080
