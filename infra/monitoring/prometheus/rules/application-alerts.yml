groups:
  - name: application-alerts
    rules:
      - alert: HighErrorRateSpring
        expr: |
          sum(rate(http_server_requests_seconds_count{job=~"logbook-service|route-service",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job=~"logbook-service|route-service"}[5m])), 0.0001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High HTTP 5xx error rate in Spring services
          description: HTTP 5xx ratio is above 5% for at least 10 minutes (route/logbook).

      - alert: HighErrorRateGenAI
        expr: |
          sum(rate(app_http_request_errors_total{service="genai-service"}[5m]))
          /
          clamp_min(sum(rate(app_http_requests_total{service="genai-service"}[5m])), 0.0001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High HTTP 5xx error rate in GenAI service
          description: HTTP 5xx ratio is above 5% for at least 10 minutes (genai-service).

      - alert: HighLatencyP95Spring
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job) (rate(http_server_requests_seconds_bucket{job=~"logbook-service|route-service"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High p95 latency in Spring services
          description: p95 request latency is above 1s for at least 10 minutes (route/logbook).

      - alert: HighLatencyP95GenAI
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (rate(app_http_request_duration_seconds_bucket{service="genai-service"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High p95 latency in GenAI service
          description: p95 request latency is above 1s for at least 10 minutes (genai-service).

      - alert: ServiceDown
        expr: up{job=~"logbook-service|route-service|genai-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Service scrape target is down
          description: One or more backend services are unreachable by Prometheus.
